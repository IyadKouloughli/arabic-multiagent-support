name: CI/CD Pipeline - Test & Deploy to GCP Cloud Run

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  ARTIFACT_REPO: nawras-repo
  IMAGE_NAME: nawras-support
  API_SERVICE: nawras-api
  DASHBOARD_SERVICE: nawras-dashboard

jobs:
  # ============================================================================
  # JOB 1: Continuous Integration (Automated Testing & Quality Gates)
  # ============================================================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Execute Component Unit Tests
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'AQ.test_mock_key' }}
          LLM_PROVIDER: gemini
          DEFAULT_MAIN_MODEL: gemini-3.8-flash
          DEFAULT_FAST_MODEL: gemini-3.8-flash
        run: |
          python tests/test_components.py

      - name: Execute FastAPI Integration Tests
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'AQ.test_mock_key' }}
          LLM_PROVIDER: gemini
          DEFAULT_MAIN_MODEL: gemini-3.8-flash
          DEFAULT_FAST_MODEL: gemini-3.8-flash
        run: |
          python tests/test_api.py

  # ============================================================================
  # JOB 2: Continuous Deployment (Build, Push to Artifact Registry, Deploy Cloud Run)
  # ============================================================================
  deploy-gcp:
    name: Deploy to Google Cloud Run
    needs: test
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.repository_owner != ''
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & Tag Docker Image
        run: |
          REGISTRY_URL="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}"
          docker build \
            -t "${REGISTRY_URL}:${{ github.sha }}" \
            -t "${REGISTRY_URL}:latest" .

      - name: Push Image to Google Artifact Registry
        run: |
          REGISTRY_URL="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}"
          docker push "${REGISTRY_URL}:${{ github.sha }}"
          docker push "${REGISTRY_URL}:latest"

      - name: Deploy FastAPI Backend Service (Cloud Run)
        run: |
          REGISTRY_URL="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}"
          gcloud run deploy ${{ env.API_SERVICE }} \
            --image "${REGISTRY_URL}:${{ github.sha }}" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars APP_MODE=api,GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}",DEFAULT_MAIN_MODEL="gemini-3.8-flash",DEFAULT_FAST_MODEL="gemini-3.8-flash",LLM_PROVIDER="gemini" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3

      - name: Deploy Streamlit Dashboard Service (Cloud Run)
        run: |
          REGISTRY_URL="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}"
          gcloud run deploy ${{ env.DASHBOARD_SERVICE }} \
            --image "${REGISTRY_URL}:${{ github.sha }}" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars APP_MODE=dashboard,GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}",DEFAULT_MAIN_MODEL="gemini-3.8-flash",DEFAULT_FAST_MODEL="gemini-3.8-flash",LLM_PROVIDER="gemini" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3

      - name: Display Live Deployment URLs
        run: |
          echo "Deployment to Google Cloud Run completed successfully!"
          API_URL=$(gcloud run services describe ${{ env.API_SERVICE }} --platform managed --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          DASHBOARD_URL=$(gcloud run services describe ${{ env.DASHBOARD_SERVICE }} --platform managed --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "FastAPI Production Docs: ${API_URL}/docs"
          echo "Streamlit Operations UI: ${DASHBOARD_URL}"
