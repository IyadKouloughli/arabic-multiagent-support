version: '3.8'

services:
  # FastAPI REST API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nawras_support_api
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./eval:/app/eval
      - ./results:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Streamlit Interactive Arabic Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nawras_support_dashboard
    command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./eval:/app/eval
      - ./results:/app/results
    depends_on:
      - api
    restart: unless-stopped
