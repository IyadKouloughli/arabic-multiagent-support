services:
  # FastAPI REST API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nawras_support_api
    environment:
      - APP_MODE=api
      - PORT=8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./eval:/app/eval
      - ./results:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Streamlit Interactive Arabic Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nawras_support_dashboard
    environment:
      - APP_MODE=dashboard
      - PORT=8501
    ports:
      - "${STREAMLIT_PORT:-8502}:8501"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./eval:/app/eval
      - ./results:/app/results
    depends_on:
      - api
    restart: unless-stopped
